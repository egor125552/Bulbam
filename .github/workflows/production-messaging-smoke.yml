name: Production Messaging Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - "web/**"
      - "test/**"
      - "wrangler*.jsonc"
      - "package.json"
      - ".github/workflows/production-messaging-smoke.yml"

permissions:
  contents: read

concurrency:
  group: bulmam-production-deploy
  cancel-in-progress: false

jobs:
  deploy-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://bulbam-api.k69ysrndm7.workers.dev
      CLOUDFLARE_ACCOUNT_ID: a72730444cac45d8e5ccd48adabdc301
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify before deploy
        run: npm run verify

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Repository secret CLOUDFLARE_API_TOKEN is required."
            exit 1
          fi

      - name: Deploy production Worker
        run: npx wrangler deploy

      - name: Wait for production readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            if curl --fail-with-body --silent --show-error "$BASE_URL/api/ready" > ready.json; then
              cat ready.json
              exit 0
            fi
            sleep 2
          done
          echo "Production Worker did not become ready."
          exit 1

      - name: Create one-run smoke secret
        shell: bash
        run: |
          set -euo pipefail
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "SMOKE_SECRET=$secret" >> "$GITHUB_ENV"
          printf '%s' "$secret" | npx wrangler secret put SMOKE_SECRET

      - name: Install WebSocket smoke client
        run: npm install --no-save ws@8

      - name: Run real two-account messaging smoke
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import WebSocket from "ws";

          const baseUrl = process.env.BASE_URL;
          const smokeSecret = process.env.SMOKE_SECRET;
          const prefix = `smoke_${process.env.GITHUB_RUN_ID}_${process.env.GITHUB_RUN_ATTEMPT}`;
          const usernameA = `${prefix}_a`;
          const usernameB = `${prefix}_b`;
          const password = "Bulbam-Production-Smoke-2026!";

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          async function request(path, { cookie, secret = false, method = "GET", body } = {}) {
            const headers = { accept: "application/json" };
            if (cookie) headers.cookie = cookie;
            if (secret) headers["x-bulbam-smoke-secret"] = smokeSecret;
            if (body !== undefined) headers["content-type"] = "application/json";
            const response = await fetch(`${baseUrl}${path}`, {
              method,
              headers,
              body: body === undefined ? undefined : JSON.stringify(body)
            });
            const text = await response.text();
            let payload = null;
            try { payload = text ? JSON.parse(text) : null; } catch {}
            if (!response.ok) {
              throw new Error(`${method} ${path} -> HTTP ${response.status}: ${text}`);
            }
            return { response, payload };
          }

          function cookieFrom(response) {
            const setCookie = response.headers.get("set-cookie") ?? "";
            const match = setCookie.match(/bulbam_session=([^;]+)/);
            if (!match) throw new Error(`Session cookie missing: ${setCookie}`);
            return `bulbam_session=${match[1]}`;
          }

          async function invite() {
            const { payload } = await request("/api/v1/smoke/invite", { secret: true, method: "POST" });
            assert(payload?.code, "Smoke invite code missing");
            return payload.code;
          }

          async function register(username, displayName, inviteCode) {
            const { response, payload } = await request("/api/v1/auth/register", {
              method: "POST",
              body: {
                username,
                displayName,
                password,
                inviteCode,
                deviceName: "GitHub Actions production smoke"
              }
            });
            return { account: payload.account, cookie: cookieFrom(response) };
          }

          async function waitForMessageEvent(ws, expectedText) {
            return new Promise((resolve, reject) => {
              const timer = setTimeout(() => reject(new Error("Realtime message event timeout")), 8000);
              const onMessage = (data) => {
                let event;
                try { event = JSON.parse(String(data)); } catch { return; }
                if (event?.type === "message.created" && event?.message?.text === expectedText) {
                  clearTimeout(timer);
                  ws.off("message", onMessage);
                  resolve(event);
                }
              };
              ws.on("message", onMessage);
            });
          }

          let socket;
          try {
            const inviteA = await invite();
            const inviteB = await invite();
            const a = await register(usernameA, "Боевой Тест Альфа", inviteA);
            const b = await register(usernameB, "Боевой Тест Бета", inviteB);

            const search = await request(`/api/v1/users/search?q=${encodeURIComponent("Боевой Тест Бета")}`, { cookie: a.cookie });
            assert(search.payload.users.some((user) => user.userId === b.account.userId), "Display-name search did not find beta");

            const opened = await request("/api/v1/chats/direct", {
              cookie: a.cookie,
              method: "POST",
              body: { userId: b.account.userId }
            });
            const conversationId = opened.payload.chat.conversationId;
            assert(conversationId, "Conversation id missing");

            const wsUrl = baseUrl.replace(/^http/, "ws") + "/api/v1/realtime";
            socket = new WebSocket(wsUrl, { headers: { Cookie: b.cookie } });
            await new Promise((resolve, reject) => {
              const timer = setTimeout(() => reject(new Error("WebSocket open timeout")), 8000);
              socket.once("open", () => { clearTimeout(timer); resolve(); });
              socket.once("error", (error) => { clearTimeout(timer); reject(error); });
            });

            const realtimeEvent = waitForMessageEvent(socket, "Сообщение 1");
            for (let index = 0; index < 10; index += 1) {
              const sender = index % 2 === 0 ? a : b;
              const sent = await request(`/api/v1/chats/${conversationId}/messages`, {
                cookie: sender.cookie,
                method: "POST",
                body: {
                  clientMessageId: `prod_${process.env.GITHUB_RUN_ID}_${index}`,
                  text: `Сообщение ${index + 1}`
                }
              });
              assert(sent.payload.status === "sent", `Message ${index + 1} was not acknowledged as sent`);
            }
            const event = await realtimeEvent;
            assert(event.message.senderUserId === a.account.userId, "Realtime event has wrong sender");

            const retry = await request(`/api/v1/chats/${conversationId}/messages`, {
              cookie: a.cookie,
              method: "POST",
              body: {
                clientMessageId: `prod_${process.env.GITHUB_RUN_ID}_0`,
                text: "Сообщение 1"
              }
            });
            assert(retry.payload.duplicate === true, "Idempotent retry was not recognized as duplicate");

            for (const user of [a, b]) {
              const history = await request(`/api/v1/chats/${conversationId}/messages`, { cookie: user.cookie });
              assert(history.payload.messages.length === 10, `Expected 10 messages, got ${history.payload.messages.length}`);
              assert(history.payload.messages[0].text === "Сообщение 1", "First message mismatch");
              assert(history.payload.messages[9].text === "Сообщение 10", "Last message mismatch");

              const chats = await request("/api/v1/chats", { cookie: user.cookie });
              assert(chats.payload.chats.some((chat) => chat.conversationId === conversationId), "Chat missing from one user's list");
            }

            console.log("Production messaging smoke passed: search, WebSocket, 10 messages, idempotency, dual history.");
          } finally {
            try { socket?.close(); } catch {}
            const cleanup = await request("/api/v1/smoke/cleanup", {
              secret: true,
              method: "POST",
              body: { prefix }
            });
            console.log(`Smoke cleanup deleted ${cleanup.payload.deletedAccounts} account(s).`);
            assert(cleanup.payload.deletedAccounts === 2, "Smoke cleanup did not delete exactly two accounts");
          }
          NODE

      - name: Remove one-run smoke secret
        if: always()
        shell: bash
        run: |
          set +e
          printf 'y\n' | npx wrangler secret delete SMOKE_SECRET
          exit 0
