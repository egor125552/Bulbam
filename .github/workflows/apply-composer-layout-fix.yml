name: Apply composer layout fix

on:
  push:
    branches: [fix/composer-grid-layout]

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: "!contains(github.event.head_commit.message, 'Исправлено растягивание поля ввода в коротком чате')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/composer-grid-layout
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused layout fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          css_path = Path('web/canonical-ui.css')
          css = css_path.read_text()
          marker = '/* Keep the conversation grid stable when optional rows are hidden. */'
          block = '''\n\n/* Keep the conversation grid stable when optional rows are hidden. */\n.conversation-header { grid-row: 1; }\n.call-banner { grid-row: 2; }\n.conversation-empty,\n.message-list { grid-row: 3; }\n.composer { grid-row: 4; }\n'''
          if marker not in css:
              css_path.write_text(css.rstrip() + block + '\n')

          test_path = Path('test/interface-layout-regression.test.js')
          test_path.write_text('''import { readFile } from "node:fs/promises";\nimport { describe, expect, it } from "vitest";\n\ndescribe("conversation layout", () => {\n  it("keeps optional call state from moving the composer into the flexible row", async () => {\n    const css = await readFile(new URL("../web/canonical-ui.css", import.meta.url), "utf8");\n    expect(css).toContain(".conversation-header { grid-row: 1; }");\n    expect(css).toContain(".call-banner { grid-row: 2; }");\n    expect(css).toContain(".message-list { grid-row: 3; }");\n    expect(css).toContain(".composer { grid-row: 4; }");\n  });\n});\n''')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['version'] = '0.6.1'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')

          Path('CHANGELOG.md').write_text('''# Журнал изменений Бульбама\n\n## Версия 0.6.1\n\nИсправлено:\n\n- в коротком чате поле ввода больше не занимает всё свободное пространство окна;\n- скрытая панель звонка больше не сдвигает список сообщений и composer по строкам CSS Grid;\n- добавлена регрессионная проверка фиксированных строк шапки, звонка, сообщений и поля ввода.\n''')
          PY
      - name: Verify focused fix
        run: |
          npm install
          npm run verify
          git diff --check
      - name: Commit verified fix
        run: |
          git config user.name "egor125552"
          git config user.email "sitkosergej55@gmail.com"
          git add web/canonical-ui.css test/interface-layout-regression.test.js package.json CHANGELOG.md
          git commit -m "Исправлено растягивание поля ввода в коротком чате"
          git push origin HEAD:fix/composer-grid-layout
