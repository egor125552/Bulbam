name: Report Production Messaging Smoke

on:
  workflow_run:
    workflows:
      - Production Messaging Smoke
    types:
      - completed

permissions:
  contents: read
  statuses: write

jobs:
  report:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Publish commit status
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUN_CONCLUSION" = "success" ]; then
            state=success
            description="Production messaging smoke passed"
          else
            state=failure
            description="Production messaging smoke: $RUN_CONCLUSION"
          fi

          gh api --method POST \
            "/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$state" \
            -f context="production-messaging-smoke" \
            -f description="$description" \
            -f target_url="$RUN_URL"
