name: Visual audit Bulbam

on:
  push:
    branches: [qa/interface-visual-audit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve Bulbam
        run: |
          python3 -m http.server 4173 --directory web >/tmp/bulbam-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 0.5; done
          exit 1
      - name: Render screenshots
        run: |
          mkdir -p visual-audit
          cat > visual-audit-runner.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const browser = await chromium.launch();
          const report = [];
          async function shot(name, width, height, theme, view, mobile=false, settings=false) {
            const context = await browser.newContext({ viewport: { width, height } });
            const page = await context.newPage();
            await page.route('**/*.js', r => r.abort());
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });
            await page.evaluate(({theme,view,mobile,settings}) => {
              document.documentElement.dataset.theme=theme;
              document.documentElement.dataset.messageView=view;
              document.body.classList.add('signed-in-mode');
              if(mobile) document.body.classList.add('conversation-open');
              document.querySelector('#signed-out').hidden=true;
              document.querySelector('#signed-in').hidden=false;
              document.querySelector('#conversation-empty').hidden=true;
              document.querySelector('#message-form').hidden=false;
              document.querySelector('#conversation-title').textContent='Разработчик2';
              document.querySelector('#conversation-peer').textContent='@creator2';
              document.querySelector('.conversation-avatar').textContent='Р';
              document.querySelector('#call-start').hidden=false;
              document.querySelector('#chat-list').innerHTML='<button class="chat-item is-current"><strong>Разработчик2</strong><span class="chat-preview">Там есть кнопка, аккаунт и настройки</span></button><button class="chat-item"><strong>Тесты в аккаунт</strong><span class="chat-preview">Голосовое сообщение</span></button>';
              document.querySelector('#message-list').innerHTML='<li class="message message-theirs"><strong class="message-author">Разработчик2</strong><p>Привет</p><span class="message-meta">20:21</span></li><li class="message message-mine"><strong class="message-author">Вы</strong><p>Короче, штука хорошая</p><span class="message-meta">21:08 · доставлено</span></li><li class="message message-theirs"><strong class="message-author">Разработчик2</strong><p>Ого, реально звонок</p><span class="message-meta">20:33</span></li>';
              if(settings) document.querySelector('#settings-dialog')?.showModal();
            },{theme,view,mobile,settings});
            await page.waitForTimeout(100);
            const metrics=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,viewport:innerWidth,overflow:document.documentElement.scrollWidth>innerWidth+1}));
            await page.screenshot({path:`visual-audit/${name}.png`,fullPage:true});
            report.push({name,...metrics});
            await context.close();
          }
          await shot('desktop-light-bubbles',1440,900,'light','bubbles');
          await shot('desktop-light-table',1440,900,'light','table');
          await shot('desktop-dark-settings',1440,900,'dark','bubbles',false,true);
          await shot('mobile-dark-chat',390,844,'dark','bubbles',true,false);
          await shot('mobile-light-chat',390,844,'light','compact',true,false);
          await writeFile('visual-audit/report.json',JSON.stringify(report,null,2));
          await browser.close();
          EOF
          node visual-audit-runner.mjs
          cat visual-audit/report.json
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: bulbam-interface-visual-audit
          path: visual-audit
          if-no-files-found: error
          retention-days: 7
