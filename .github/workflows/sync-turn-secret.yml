name: Sync TURN secret to Cloudflare

on:
  workflow_dispatch:

concurrency:
  group: bulbam-turn-secret
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  configure-turn:
    name: Configure private TURN credential
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check protected settings are available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BULBAM_TURN_SECRET: ${{ secrets.BULBAM_TURN_SECRET }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID not configured"; exit 1; }
          test -n "$BULBAM_TURN_SECRET" || { echo "::error::BULBAM_TURN_SECRET not configured"; exit 1; }

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm ci --legacy-peer-deps

      - name: Configure the secret without logging its value
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BULBAM_TURN_SECRET: ${{ secrets.BULBAM_TURN_SECRET }}
        run: |
          printf '%s' "$BULBAM_TURN_SECRET" | npx wrangler secret put WEBRTC_TURN_SECRET --name bulbam-api
          echo "TURN credential sent to Cloudflare Worker."
